# --- TAP/DEBOUNCE SETTINGS ---
# Increase debounce to prevent accidental double-taps
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=15
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=15

# --- POWER ---
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- BLUETOOTH ---
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- KEYBOARD INFO ---
CONFIG_ZMK_KEYBOARD_NAME="renseki"