# --- POWER MANAGEMENT ---
# Enable deep sleep support (saves battery when not in use)
CONFIG_ZMK_SLEEP=y
# 900,000 milliseconds = 15 minutes of inactivity before deep sleep
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- BLUETOOTH SETTINGS ---
# Increase the Bluetooth transmission power to maximum (+8 dBm)
# This helps prevent lag or connection drops between the two halves
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- KEYBOARD INFO ---
# The name that will appear in your Bluetooth settings
CONFIG_ZMK_KEYBOARD_NAME="renseki"

# --- COMPATIBILITY ---
# Improves compatibility with some host OS media keys
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y